[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --disable-warnings
    --strict-markers
    --color=yes
markers =
    asyncio: marks tests as async
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    session: marks tests related to session management
    database: marks tests related to database operations
    roles: marks tests related to user roles
    permissions: marks tests related to permissions
    endpoints: marks tests for API endpoints
